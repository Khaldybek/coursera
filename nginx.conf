server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Обрабатываем ошибку 404, чтобы React мог рендерить страницу
    error_page 404 /index.html;

    location = /index.html {
        allow all;
        log_not_found off;
    }

    # Статические файлы (React обычно кладёт их в /static/)
    location /static/ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|mp4)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15724800";
    }
}